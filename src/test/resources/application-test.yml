spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:~/ufo_fi
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

oauth:
  kakao:
    client-id: test-clientId
    client-secret: test-client-secret
    redirect-uri: https://test-client-redirect-uri
    token-base-url: https://kauth.kakao.com/oauth/token
    user-info-request-url: https://kapi.kakao.com/v2/user/me
    scope:
      - account_email

jwt:
  secret:
  access-token-validity-ms:
  refresh-token-validity-ms:

payment:
  client-key: secretsecretsecret
  secret-key: secretsecretsecret
  confirmUrl: secretsecretsecret

firebase:
  config-path: http://localhost:8080
  base-url: http://localhost:8080

slack:
  token: slackslackslack

login:
  success-url: localhost:3000
